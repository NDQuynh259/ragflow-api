[project]
name = "rag-document-pipeline"
version = "0.1.0"
dependencies = [
    "pydantic>=2.8",
    "rag-contracts",
    "opendataloader-pdf>=2.0.0",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
]
requires-python = ">=3.11"
[tool.uv.sources]
rag-contracts = { workspace = true }
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pyright]
venvPath = "../.."
venv = ".venv"
extraPaths = [
    "../rag-contracts/src",
]

