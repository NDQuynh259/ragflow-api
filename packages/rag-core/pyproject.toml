[project]
name = "rag-core"
version = "0.1.0"
dependencies = [
    "pydantic>=2.8",
    "rag-contracts",
    "google-genai>=1.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]
requires-python = ">=3.11"

[tool.uv.sources]
rag-contracts = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pyright]
venvPath = "../.."
venv = ".venv"
extraPaths = [
    "../rag-contracts/src",
]

