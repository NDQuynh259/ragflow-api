services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres_prod
    restart: unless-stopped
    ports:
      - "45432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_prod_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  migration:
    image: ${APP_IMAGE:-ghcr.io/ndquynh259/ragflow-api:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: rag_migration_prod
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-rag_db}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rag_prod_net
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rag_rabbitmq_prod
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data_prod:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_prod_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M

  chat-api:
    image: ${APP_IMAGE:-ghcr.io/ndquynh259/ragflow-api:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: rag_chat_api_prod
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-rag_db}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      - STORAGE_DIR=/app/output/storage
    volumes:
      - rag_storage_prod:/app/output/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rag_prod_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  worker:
    image: ${APP_IMAGE:-ghcr.io/ndquynh259/ragflow-api:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: rag_worker_prod
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-rag_db}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      - STORAGE_DIR=/app/output/storage
    volumes:
      - rag_storage_prod:/app/output/storage
    command: ["python", "-m", "worker.main"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - rag_prod_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M

volumes:
  pgdata_prod:
  rag_storage_prod:
  rabbitmq_data_prod:

networks:
  rag_prod_net:
    driver: bridge
