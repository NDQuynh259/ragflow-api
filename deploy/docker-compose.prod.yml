services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres_prod
    restart: unless-stopped
    ports:
      - "45432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_prod_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  migration:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: rag_migration_prod
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-rag_db}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rag_prod_net
    restart: "no"

  chat-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: rag_chat_api_prod
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-rag_db}
      - STORAGE_DIR=/app/output/storage
    volumes:
      - rag_storage_prod:/app/output/storage
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rag_prod_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  pgdata_prod:
  rag_storage_prod:

networks:
  rag_prod_net:
    driver: bridge
