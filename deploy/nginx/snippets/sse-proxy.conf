# ==============================================================================
# Tối ưu hóa đặc thù cho Server-Sent Events (SSE) Realtime Streaming
# ==============================================================================
proxy_http_version 1.1;
proxy_set_header Connection '';

# Tắt triệt để bộ đệm buffer để stream từng token chữ realtime
proxy_buffering off;
proxy_cache off;
chunked_transfer_encoding on;

# Thời gian chờ cho các câu trả lời suy luận dài của mô hình AI
proxy_read_timeout 300s;
proxy_send_timeout 300s;
