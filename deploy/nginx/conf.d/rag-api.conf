upstream chat_api_backend {
    server chat-api:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Giới hạn kích thước upload tài liệu PDF (100MB)
    client_max_body_size 100M;

    # Khôi phục IP thật của người dùng nếu traffic đi qua Cloudflare
    include /etc/nginx/snippets/cf-real-ip.conf;

    # --------------------------------------------------------------------------
    # Health check endpoint độc lập cho Nginx
    # --------------------------------------------------------------------------
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # --------------------------------------------------------------------------
    # Route 1: SSE Streaming (Hỏi đáp Chat RAG realtime gõ chữ từng token)
    # --------------------------------------------------------------------------
    location ~* ^/api/v1/messages/(stream|query) {
        limit_req zone=api_limit burst=15 nodelay;

        proxy_pass http://chat_api_backend;
        include /etc/nginx/snippets/sse-proxy.conf;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Route 2: Xác thực danh tính (Auth - Chống Brute Force)
    # --------------------------------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://chat_api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Route 3: Toàn bộ REST Endpoints còn lại
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://chat_api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
