name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Code Quality & Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set Up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Workspace Dependencies
        run: uv sync --all-packages

      - name: Run Quality Gate Checks (Ruff, Pyright, Pytest)
        run: uv run poe check

  package:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ragflow-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,format=short

      - name: Build and Push Production Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            APP_DIR="/root/rag"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Pull latest git changes for compose/config files
            if [ -d ".git" ]; then
              git fetch origin ${{ github.ref_name }}
              git reset --hard origin/${{ github.ref_name }}
            else
              git init
              git remote add origin https://github.com/${{ github.repository }}.git || git remote set-url origin https://github.com/${{ github.repository }}.git
              git fetch origin ${{ github.ref_name }}
              git checkout -f -B ${{ github.ref_name }} origin/${{ github.ref_name }}
            fi

            # Authenticate with GHCR using GITHUB_TOKEN
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Resolve image name in lowercase
            RAW_REPO="${{ github.repository }}"
            LOWER_REPO=$(echo "$RAW_REPO" | tr '[:upper:]' '[:lower:]')
            export APP_IMAGE="ghcr.io/$LOWER_REPO/ragflow-api:latest"

            # Clean up old unused images before pull to save disk space
            docker image prune -a -f || true

            # Pull pre-built image from GHCR (takes only seconds)
            docker compose -f deploy/docker-compose.prod.yml pull

            # Start database and message broker first
            docker compose -f deploy/docker-compose.prod.yml up -d postgres rabbitmq

            # Run database migrations
            docker compose -f deploy/docker-compose.prod.yml run --rm migration

            # Restart application, worker, scheduler, and nginx reverse proxy
            docker compose -f deploy/docker-compose.prod.yml up -d --remove-orphans chat-api worker scheduler nginx

            # Clean up old unused images to save NVMe disk space
            docker image prune -f

            echo "Deployment completed successfully!"
