[project]
name = "scheduler"
version = "0.1.0"
dependencies = [
    "core",
    "chat-api",
]
requires-python = ">=3.11"

[tool.uv.sources]
core = { workspace = true }
chat-api = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pyright]
venvPath = "../.."
venv = ".venv"
extraPaths = [
    "../../core/src",
    "../../apps/chat-api/src",
    "../../packages/rag-contracts/src",
]
